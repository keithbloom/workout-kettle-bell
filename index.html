<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Kettlebell and mat</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F3F5; --surface:#FFFFFF; --text:#14161A; --muted:#565F6B; --line:#D8DCE2;
  --ink:#14161A; --ink-fg:#FFFFFF; --focus:#3448E5;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1013; --surface:#171A1F; --text:#F1F2F4; --muted:#9AA3AF; --line:#2A2F37;
    --ink:#F1F2F4; --ink-fg:#0E1013; --focus:#8794FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#171A1F; --text:#F1F2F4; --muted:#9AA3AF; --line:#2A2F37;
  --ink:#F1F2F4; --ink-fg:#0E1013; --focus:#8794FF;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* phase colours, used by bands, timeline and the player */
[data-phase="warmup"]{--pbg:#F4B63F;--pfg:#1D1606;--pacc:#F4B63F}
[data-phase="strength"]{--pbg:#3448E5;--pfg:#FFFFFF;--pacc:#95A1FF}
[data-phase="endurance"]{--pbg:#D9381E;--pfg:#FFFFFF;--pacc:#FF8068}
[data-phase="core"]{--pbg:#0C7A5E;--pfg:#FFFFFF;--pacc:#45D1A6}
[data-phase="cooldown"]{--pbg:#B8A9F0;--pfg:#191533;--pacc:#C9BEF7}
[data-phase="hiit"]{--pbg:#C2277A;--pfg:#FFFFFF;--pacc:#FF7DB8}

/* ---------- views ---------- */
.view{max-width:640px;margin:0 auto;padding:24px 18px 120px}
h1{margin:0 0 8px;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
.lede{margin:0 0 20px;color:var(--muted);max-width:44ch}
.timeline{display:flex;gap:4px;margin:0 0 10px}
.timeline i{display:block;height:12px;border-radius:6px;background:var(--pbg)}
.hist{margin:0 0 20px;color:var(--muted);font-size:14px;min-height:1.4em}

.band{background:var(--pbg);color:var(--pfg);border-radius:14px;margin:0 0 10px;overflow:hidden}
.band-head{display:grid;grid-template-columns:1fr auto 22px;gap:10px;align-items:center;width:100%;min-height:76px;padding:14px 16px;border:0;background:none;text-align:left}
.band-name{display:block;font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.band-moves{display:block;margin-top:3px;font-size:14px;line-height:1.3;opacity:.82;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.band-min{font-size:16px;font-weight:700;white-space:nowrap}
.band-head svg{width:22px;height:22px;transition:transform .2s}
.band-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.band-body{padding:2px 16px 16px;border-top:1px solid rgba(128,128,128,.4)}
.band-intro{margin:12px 0 4px;font-size:15px;opacity:.9}
.mv{padding:12px 0;border-bottom:1px solid rgba(128,128,128,.35)}
.mv-top{display:flex;justify-content:space-between;gap:12px;font-size:16px}
.mv-top b{font-weight:800}
.mv-top span{font-weight:600;opacity:.85;white-space:nowrap}
.mv p{margin:5px 0 0;font-size:15px;line-height:1.45;opacity:.92}
.band-start{margin-top:14px;min-height:48px;padding:0 18px;border-radius:12px;border:2px solid currentColor;background:none;font-weight:700;font-size:16px}

.start-wrap{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding-top:14px;margin-top:6px}
.cta{width:100%;min-height:60px;border-radius:18px;border:0;background:var(--ink);color:var(--ink-fg);font-size:19px;font-weight:800;letter-spacing:-.01em}
.cta:active{transform:scale(.99)}

/* timer tab */
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.step-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.step-row:last-of-type{border-bottom:1px solid var(--line)}
.step-lbl{font-size:18px;font-weight:700}
.step-ctl{display:flex;align-items:center;gap:6px}
.step-ctl button{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:26px;font-weight:600;line-height:1}
.step-ctl output{min-width:84px;text-align:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.total{margin:14px 0 0;color:var(--muted)}

/* settings tab */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.set-row b{display:block;font-size:17px}
.set-row small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:2px}
.sw{flex:none;width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.set-row[aria-checked="true"] .sw{background:#1F9D63}
.set-row[aria-checked="true"] .sw::after{transform:translateX(20px)}
.set-block{padding:18px 0;border-top:1px solid var(--line)}
.set-block h2{margin:0 0 6px;font-size:18px}
.set-block p{margin:0 0 12px;color:var(--muted);font-size:15px;max-width:52ch}
.btn2{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px}
.status{margin-top:10px;font-size:14px;color:var(--muted)}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{position:relative;height:60px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;font-weight:600;color:var(--muted)}
#nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--text)}
#nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}

/* ---------- player ---------- */
.player{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:var(--pbg);color:var(--pfg);padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 16px);transition:background-color .25s,color .25s}
.player[data-tone="rest"]{--pbg:#16181D;--pfg:#F2F3F5}
.p-top{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:8px;min-height:52px}
.ibtn{width:48px;height:48px;border-radius:14px;border:0;background:none;color:inherit;display:grid;place-items:center}
.ibtn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.p-head{min-width:0}
#p-phase{font-weight:800;font-size:17px;line-height:1.2}
#p-round{font-size:14px;opacity:.85;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:3px;margin:8px 0 6px}
.seg span{display:block;height:6px;border-radius:3px;background:rgba(128,128,128,.4);overflow:hidden}
.seg i{display:block;height:100%;width:100%;background:var(--pfg);transform-origin:left;transform:scaleX(0)}
.player[data-tone="rest"] .seg i{background:var(--pacc)}
.p-main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
.p-inner{margin:auto 0;padding:14px 0}
.p-title{font-size:clamp(32px,10vw,56px);font-weight:800;line-height:1.03;letter-spacing:-.025em;text-wrap:balance}
.p-sub{margin-top:10px;font-size:20px;line-height:1.3;opacity:.9}
.p-hint{margin-top:8px;font-size:17px;font-weight:700;color:var(--pacc)}
.player:not([data-tone="rest"]) .p-hint{color:inherit}
.p-clock{margin-top:14px;font-size:clamp(96px,32vw,200px);line-height:.95;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.paused .p-clock{opacity:.45}
.p-bar{height:8px;border-radius:4px;background:rgba(128,128,128,.4);overflow:hidden;margin-top:14px}
.p-bar i{display:block;height:100%;width:100%;background:var(--pfg);transform-origin:left;transform:scaleX(0)}
.player[data-tone="rest"] .p-bar i{background:var(--pacc)}
.p-next{margin-top:14px;font-size:17px;opacity:.85}
.tasks{margin-top:16px;display:grid;gap:8px}
.task{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:8px 14px;border-radius:16px;border:2px solid currentColor;background:none;text-align:left;font-size:20px;font-weight:700;line-height:1.2}
.task .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid currentColor;display:grid;place-items:center}
.task .ck svg{width:16px;height:16px;fill:none;stroke:var(--pbg);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task[aria-pressed="true"]{background:var(--pfg);color:var(--pbg)}
.task[aria-pressed="true"] .ck{background:var(--pbg);border-color:var(--pbg)}
.task[aria-pressed="true"] .ck svg{stroke:var(--pfg);opacity:1}
.task[aria-pressed="true"] span.t{text-decoration:line-through;text-decoration-thickness:2px}
.cue{margin-top:12px;display:inline-block;padding:8px 14px;border-radius:12px;background:var(--pfg);color:var(--pbg);font-weight:800;font-size:20px}
.more{margin-top:14px;min-height:44px;padding:0 4px;border:0;background:none;color:inherit;font-weight:700;font-size:16px;text-decoration:underline;text-underline-offset:4px}
.details{margin-top:6px;padding:4px 14px 14px;border-radius:14px;background:rgba(128,128,128,.2)}
.details h3{margin:12px 0 2px;font-size:17px}
.details p{margin:0;font-size:16px;line-height:1.45}
.p-controls{display:grid;grid-template-columns:1fr 2.2fr 1fr;gap:10px;padding-top:12px}
.pbtn{min-height:68px;border-radius:20px;border:2px solid currentColor;background:none;color:inherit;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.pbtn svg{width:26px;height:26px;fill:currentColor}
.pbtn.primary{background:var(--pfg);color:var(--pbg);border-color:var(--pfg)}
.pbtn:active{transform:scale(.98)}
.finish,.confirm{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 22px calc(env(safe-area-inset-bottom,0px) + 24px)}
.finish{background:#16181D;color:#F2F3F5}
.finish h2{margin:0 0 10px;font-size:clamp(38px,12vw,64px);line-height:1;font-weight:800;letter-spacing:-.03em}
.finish p{margin:0 0 6px;font-size:20px;opacity:.9}
.finish .seg{margin:0 0 22px}
.finish .seg i{background:var(--pacc);transform:scaleX(1)}
.confirm{background:rgba(10,11,13,.86);color:#F2F3F5;align-items:stretch}
.confirm h2{margin:0 0 8px;font-size:30px;line-height:1.1;font-weight:800}
.confirm p{margin:0 0 22px;font-size:18px;opacity:.9}
.confirm .pbtn{margin-top:10px}
.confirm .pbtn.primary{background:#F2F3F5;color:#16181D;border-color:#F2F3F5}
#p-finish .pbtn.primary{margin-top:24px;background:#F2F3F5;color:#16181D;border-color:#F2F3F5}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important}
}
@media (min-width:700px){
  .p-inner{max-width:640px}
}
</style>
</head>
<body>
<main>
  <section id="view-workout" class="view"></section>
  <section id="view-timer" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>

<nav id="nav" aria-label="Main">
  <button type="button" data-tab="workout" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="15" r="6.5"/><path d="M8.6 10.3c-.9-6.6 6.9-6.6 6.8 0"/></svg>
    Workout
  </button>
  <button type="button" data-tab="timer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 13.5V9.5M9.5 2.5h5"/></svg>
    Interval timer
  </button>
  <button type="button" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    Settings
  </button>
</nav>

<div id="player" class="player" data-phase="warmup" data-tone="work" role="dialog" aria-modal="true" aria-label="Session in progress" hidden>
  <div class="p-top">
    <button type="button" class="ibtn" id="p-close" aria-label="End session"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="p-head"><div id="p-phase"></div><div id="p-round"></div></div>
    <button type="button" class="ibtn" id="p-sound" aria-label="Sound on" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path id="p-wave" d="M15.5 9c1.6 1.6 1.6 4.4 0 6M18 6.5c3.1 3.1 3.1 8.9 0 12"/></svg></button>
  </div>
  <div class="seg" id="p-seg" aria-hidden="true"></div>
  <div class="p-main" id="p-main">
    <div class="p-inner">
      <div class="p-title" id="p-title" aria-live="polite"></div>
      <div class="p-sub" id="p-sub"></div>
      <div class="p-hint" id="p-hint"></div>
      <div class="p-clock" id="p-clock" role="timer" aria-live="off"></div>
      <div class="p-bar" id="p-bar"><i id="p-barfill"></i></div>
      <div class="tasks" id="p-tasks"></div>
      <div class="cue" id="p-cue" role="status" hidden></div>
      <div class="p-next" id="p-next"></div>
      <button type="button" class="more" id="p-more" aria-expanded="false">How to do it</button>
      <div class="details" id="p-details" hidden></div>
    </div>
  </div>
  <div class="p-controls">
    <button type="button" class="pbtn" id="p-back" aria-label="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2.5v14H6zM19 5v14L9.5 12z"/></svg></button>
    <button type="button" class="pbtn primary" id="p-main-btn"></button>
    <button type="button" class="pbtn" id="p-fwd" aria-label="Skip"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 5H18v14h-2.5zM5 5v14l9.5-7z"/></svg></button>
  </div>

  <div class="finish" id="p-finish" hidden>
    <div class="seg" id="p-fseg" aria-hidden="true"></div>
    <h2 id="f-title">Session complete</h2>
    <p id="f-time"></p>
    <p id="f-week"></p>
    <button type="button" class="pbtn primary" id="f-close">Back to the app</button>
  </div>
  <div class="confirm" id="p-confirm" hidden>
    <h2>End this session?</h2>
    <p>Your progress won't be saved.</p>
    <button type="button" class="pbtn primary" id="c-keep">Keep going</button>
    <button type="button" class="pbtn" id="c-end">End session</button>
  </div>
</div>

<script>
(function(){
'use strict';
/* Snapshot of the page as delivered, used to build the offline copy. Must run first. */
var SNAPSHOT=''; try{SNAPSHOT=document.documentElement.outerHTML}catch(e){}

/* ================= data ================= */
var M={
 catcow:{name:'Cat-cow',dose:'10 reps',desc:'On hands and knees. Arch your back and lift your chest and tailbone, then round your spine and tuck your chin. Move with your breathing.'},
 bridge:{name:'Glute bridge',dose:'10 reps',desc:'Lie on your back, knees bent, feet flat and hip-width apart. Push through your heels to lift your hips until shoulders, hips and knees form a straight line. Squeeze your glutes at the top and lower slowly.'},
 squat:{name:'Bodyweight squat',dose:'10 reps',desc:'Feet shoulder-width apart. Sit your hips back and down, keeping your chest up and knees tracking over your toes. Stand tall.'},
 inchworm:{name:'Inchworm',dose:'5 reps',desc:'Stand, then hinge forward and walk your hands out to a high plank. Pause, walk your feet toward your hands, then stand back up.'},
 goblet:{name:'Goblet squat',dose:'45 sec',desc:'Hold the bell at your chest by the horns, elbows tucked in. Squat as deep as you can with your chest tall, then drive up through your heels.'},
 row:{name:'Bent-over row',dose:'45 sec',desc:'Hinge at the hips with a flat back, bell in one hand and free hand on your thigh. Pull the bell to your hip, squeezing your shoulder blade, then lower under control. Switch arms halfway.'},
 rdl:{name:'Romanian deadlift',dose:'45 sec',desc:'Hold the bell in front of your thighs with soft knees. Push your hips back and slide the bell down your legs until you feel a hamstring stretch, back flat. Drive your hips forward to stand.'},
 press:{name:'Floor press or overhead press',dose:'45 sec',desc:'Floor press: lie on your back, knees bent, elbow resting on the floor, and press the bell straight up. Overhead press: stand, and press from shoulder to overhead with ribs down. Switch arms halfway.'},
 swing:{name:'Kettlebell swing',dose:'20 reps',desc:'Feet wider than shoulders, bell on the floor just ahead of you. Hinge, hike the bell back between your legs, then snap your hips forward to float it to chest height. The power comes from your hips, not your arms.'},
 lunge:{name:'Reverse lunge',dose:'10 reps (5 per leg)',desc:'Hold the bell at your chest. Step one foot back and lower until the back knee nearly touches the floor, front shin vertical. Push through the front heel to return, then switch legs.'},
 pushup:{name:'Push-up',dose:'5 reps',desc:'Hands under shoulders, body in one straight line. Lower your chest toward the floor, then press back up. Drop to your knees if you need to.'},
 plank:{name:'Plank',dose:'30 sec',desc:'Forearms on the mat, elbows under your shoulders. Make a straight line from head to heels, brace your abs and squeeze your glutes.'},
 twist:{name:'Russian twist',dose:'30 sec',desc:'Sit with knees bent and lean back slightly, holding the bell at your chest. Rotate side to side, tapping the bell down beside each hip. Lift your feet to make it harder.'},
 deadbug:{name:'Dead bug',dose:'30 sec',desc:'Lie on your back with arms pointing to the ceiling and knees bent over your hips. Lower your opposite arm and leg toward the floor, keeping your lower back pressed into the mat. Return and alternate.'},
 sideplank:{name:'Side plank',dose:'15 sec per side',desc:'On one forearm with feet stacked, lift your hips so your body forms a straight line. Keep your hips high and hold.'},

 fig4:{name:'Figure-4 glute stretch',dose:'30 sec per side',desc:'Lie on your back and cross one ankle over the opposite knee. Pull the bottom thigh toward your chest until you feel a stretch in the glute.'},
 shoulder:{name:'Cross-body shoulder stretch',dose:'30 sec per side',desc:'Draw one arm across your chest and hold it with the other. Keep your shoulders relaxed and away from your ears.'}
};
var SECTIONS=[
 {id:'warmup',title:'Warm-up',mins:5,intro:'Go smoothly and don\u2019t rush. Raise your heart rate and loosen your hips, shoulders and spine.',moves:['catcow','bridge','squat','inchworm']},

];
var PH={warmup:'Warm-up',strength:'Strength',endurance:'Endurance',core:'Core',cooldown:'Cool-down',hiit:'Interval timer'};
var PRESETS=[
 {label:'Tabata 20/10 \u00d7 8',work:20,rest:10,rounds:8},
 {label:'30/30 \u00d7 10',work:30,rest:30,rounds:10},

 {label:'45/15 \u00d7 8',work:45,rest:15,rounds:8},
 {label:'60/30 \u00d7 5',work:60,rest:30,rounds:5}
];

/* ================= storage ================= */
function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S=Object.assign({sound:true,vibrate:true,voice:false,awake:true},load('kb.settings',{}));
var C=Object.assign({work:40,rest:20,rounds:8,prep:5},load('kb.timer',{}));
var H=load('kb.history',[]); if(!Array.isArray(H)) H=[];

/* ================= helpers ================= */
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function pad(n){return n<10?'0'+n:''+n}
function fmt(sec){sec=Math.max(0,Math.round(sec));return sec>=60?Math.floor(sec/60)+':'+pad(sec%60):''+sec}
function fmtLong(sec){sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+pad(sec%60)}
function clamp(x,a,b){return Math.min(b,Math.max(a,x))}
function weekStart(){var d=new Date();d.setHours(0,0,0,0);var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getTime()}
function weekCount(){var w=weekStart();return H.filter(function(h){return h.t>=w}).length}
function plural(n,w){return n+' '+w+(n===1?'':'s')}
var CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

/* ================= audio, haptics, voice, wake lock ================= */
var AC=null;
function ensureAudio(){try{if(!AC){var Ctx=window.AudioContext||window.webkitAudioContext;if(Ctx)AC=new Ctx()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function blip(freq,dur,delay,vol,type){
  if(!S.sound||!AC)return;
  try{
    var t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.3,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+dur+0.03);
  }catch(e){}
}
function sound(kind){
  if(kind==='count')blip(880,0.09,0,0.28);
  else if(kind==='go'){blip(1175,0.24,0,0.34,'triangle')}
  else if(kind==='rest'){blip(523,0.16,0,0.3);blip(392,0.22,0.17,0.3)}
  else if(kind==='half'){blip(740,0.08,0,0.3);blip(740,0.08,0.14,0.3)}
  else if(kind==='done'){[523,659,784,1047].forEach(function(f,i){blip(f,0.26,i*0.16,0.32,'triangle')})}
}
function buzz(p){try{if(S.vibrate&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function say(t){
  if(!S.voice||!t)return;
  try{if('speechSynthesis' in window){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.rate=1.05;window.speechSynthesis.speak(u)}}catch(e){}
}
var WL=null;
function wakeOn(){
  if(!S.awake)return;
  try{if(navigator.wakeLock&&navigator.wakeLock.request){navigator.wakeLock.request('screen').then(function(l){WL=l;l.addEventListener('release',function(){WL=null})}).catch(function(){})}}catch(e){}
}
function wakeOff(){try{if(WL)WL.release()}catch(e){}WL=null}

/* ================= building the step lists ================= */
function dm(k){return {name:M[k].name,desc:M[k].desc}}
function buildWorkout(from){
  var st=[];
  function prep(sec,phase,dur,hint){return {sec:sec,phase:phase,type:'prep',title:'Get ready',dur:dur,hint:hint||'',round:''}}
  function rest(sec,phase,dur,hint,round){return {sec:sec,phase:phase,type:'rest',title:'Rest',dur:dur,hint:hint||'',round:round||''}}
  function work(sec,phase,k,dur,o){
    o=o||{};
    var side=o.side?o.side.toLowerCase():'';
    var sub=o.side?(o.side+', '+dur+' seconds'):(dur+' seconds'+(o.half?', switch arms halfway':''));
    return {sec:sec,phase:phase,type:'work',title:M[k].name,sub:sub,dur:dur,round:o.round||'',details:[dm(k)],
      lbl:M[k].name+(side?', '+side:''),say:M[k].name+(side?', '+side:''),half:o.half||''};
  }
  /* 0 warm-up */
  var wu=SECTIONS[0].moves;
  wu.forEach(function(k,n){st.push({sec:0,phase:'warmup',type:'reps',title:M[k].name,sub:M[k].dose,round:'Move '+(n+1)+' of '+wu.length,est:Math.round(300/wu.length),details:[dm(k)],lbl:M[k].name,say:M[k].name})});
  /* 1 strength */
  st.push(prep(1,'strength',10,'Pick up your heavier bell.'));
  var sm=SECTIONS[1].moves;
  for(var r=1;r<=2;r++){
    sm.forEach(function(k,n){
      var lastOne=(r===2&&n===sm.length-1);
      st.push(work(1,'strength',k,45,{round:'Round '+r+' of 2',half:(k==='row'||k==='press')?'Switch arms':''}));
      st.push(lastOne?rest(2,'endurance',15,'Switch to your lighter bell.'):rest(1,'strength',15,'','Round '+r+' of 2'));
    });
  }
  /* 2 endurance */
  var en=SECTIONS[2].moves;
  for(var e=1;e<=4;e++){
    st.push({sec:2,phase:'endurance',type:'emom',title:'Round '+e+' of 4',sub:'Tap each line when you finish it.',round:'A new round every 2 minutes',dur:120,
      tasks:['20 kettlebell swings','10 reverse lunges (5 per leg)','5 push-ups'],details:en.map(dm),lbl:'Round '+e+' of 4',say:'Round '+e});
  }
  /* 3 core */
  st.push(prep(3,'core',10,'Put the bell down and get onto the mat.'));
  for(var c=1;c<=2;c++){
    var rl='Round '+c+' of 2';
    st.push(work(3,'core','plank',30,{round:rl}));
    st.push(work(3,'core','twist',30,{round:rl}));
    st.push(work(3,'core','deadbug',30,{round:rl}));
    st.push(work(3,'core','sideplank',15,{round:rl,side:'Left side'}));
    st.push(work(3,'core','sideplank',15,{round:rl,side:'Right side'}));
  }
  /* 4 cool-down */
  st.push(prep(4,'cooldown',10,'Slow, easy breathing.'));
  var cd=[];
  cd.push(work(4,'cooldown','child',45));
  [['hipflex','Left side','Right side'],['hamstring','Left side','Right side'],['fig4','Left side','Right side'],['shoulder','Left side','Right side']].forEach(function(g){
    cd.push(work(4,'cooldown',g[0],30,{side:g[1]}));
    cd.push(work(4,'cooldown',g[0],30,{side:g[2]}));
  });
  cd.forEach(function(s,i){s.round='Stretch '+(i+1)+' of '+cd.length;st.push(s)});

  var steps=st.filter(function(s){return s.sec>=from});
  if(from===0)steps.unshift(prep(0,'warmup',5,''));
  return finalize(steps);
}
function buildHiit(){
  var st=[],N=C.rounds;
  if(C.prep>0)st.push({phase:'hiit',type:'prep',title:'Get ready',sub:'Round 1 starts soon',dur:C.prep,round:'',hint:''});
  for(var r=1;r<=N;r++){
    st.push({phase:'hiit',type:'work',title:'Work',sub:C.work+' seconds',dur:C.work,round:'Round '+r+' of '+N,lbl:'Work',say:'Work'});
    if(r<N&&C.rest>0)st.push({phase:'hiit',type:'rest',title:'Rest',sub:'Next: round '+(r+1),dur:C.rest,round:'Round '+r+' of '+N,hint:'',say:'Rest'});
  }
  return finalize(st,true);
}
function finalize(steps,simple){
  if(!simple){
    steps.forEach(function(s,i){
      var nx=null,k;
      for(k=i+1;k<steps.length;k++){var t=steps[k].type;if(t==='work'||t==='emom'||t==='reps'){nx=steps[k];break}}
      if(s.type==='rest'||s.type==='prep'){
        if(nx){s.sub='Next: '+nx.lbl;s.details=nx.details;s.say=(s.type==='rest'?'Rest. ':'Get ready. ')+'Next, '+nx.lbl}
        else{s.sub='';s.say=s.type==='rest'?'Rest':'Get ready'}
      }else{
        s.nextText=nx?'Next: '+nx.lbl:'Last one';
      }
    });
  }
  var cum=[],tot=0;
  steps.forEach(function(s,i){cum[i]=tot;tot+=(s.dur||s.est||0)});
  var segs=[];
  steps.forEach(function(s,i){
    var w=(s.dur||s.est||0),last=segs[segs.length-1];
    if(last&&last.phase===s.phase)last.total+=w;else segs.push({phase:s.phase,start:cum[i],total:w});
  });
  return {steps:steps,cum:cum,total:tot,segs:segs};
}

/* ================= player ================= */
var P={active:false,run:null,steps:[],i:0,paused:false,pausedAt:0,endsAt:0,stepStart:0,lastTick:0,activeMs:0,lastBeep:null,halfDone:false,ticks:[],emomRest:false,detailsOpen:false,kind:'workout',timer:null,segEls:[],cueTimer:null};
var el={};
['player','p-phase','p-round','p-seg','p-title','p-sub','p-hint','p-clock','p-bar','p-barfill','p-tasks','p-cue','p-next','p-more','p-details','p-main-btn','p-back','p-fwd','p-close','p-sound','p-wave','p-finish','p-fseg','f-title','f-time','f-week','f-close','p-confirm','c-keep','c-end'].forEach(function(id){el[id]=$(id)});

var ICON_PAUSE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>Pause';
var ICON_PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>Resume';

function cur(){return P.steps[P.i]}
function isRest(s){return s.type==='rest'||s.type==='prep'||(s.type==='emom'&&P.emomRest)}

function startPlayer(run,kind){
  P.run=run;P.steps=run.steps;P.kind=kind;P.i=0;P.active=true;P.paused=false;P.activeMs=0;
  ensureAudio();wakeOn();
  el['p-finish'].hidden=true;el['p-confirm'].hidden=true;
  el['p-seg'].innerHTML=run.segs.map(function(sg){return '<span style="flex:'+Math.max(sg.total,1)+'"><i></i></span>'}).join('');
  P.segEls=[].slice.call(el['p-seg'].querySelectorAll('i'));
  el.player.hidden=false;
  document.body.style.overflow='hidden';
  var t=Date.now();P.lastTick=t;
  enterStep(0,t);cueStart(cur());
  clearInterval(P.timer);P.timer=setInterval(tick,100);
  try{el['p-main-btn'].focus()}catch(e){}
}
function enterStep(i,t){
  P.i=i;var s=cur();
  P.stepStart=t;P.endsAt=s.dur?t+s.dur*1000:0;
  P.lastBeep=null;P.halfDone=false;P.ticks=[];P.emomRest=false;P.detailsOpen=(s.type==='reps');
  hideCue();
  renderStep();updateClock(Date.now());
}
function goto(i){
  var t=Date.now();
  enterStep(i,t);
  if(P.paused)P.pausedAt=t;else cueStart(cur());
}
function cueStart(s){
  if(isRest(s)){sound('rest');buzz([80,60,80])}else if(s.type==='reps'){sound('count');buzz(60)}else{sound('go');buzz(140)}
  say(s.say||s.title);
}
function renderStep(){
  var s=cur(),rest=isRest(s),emRest=(s.type==='emom'&&P.emomRest);
  el.player.dataset.phase=s.phase;
  el.player.dataset.tone=rest?'rest':'work';
  el.player.classList.toggle('paused',P.paused);
  el['p-phase'].textContent=PH[s.phase]||'';
  el['p-round'].textContent=s.round||'';
  el['p-title'].textContent=emRest?'Rest':s.title;
  el['p-sub'].textContent=emRest?(s.nextText||''):(s.sub||'');
  el['p-hint'].textContent=emRest?'':(s.hint||'');
  el['p-hint'].hidden=!(el['p-hint'].textContent);
  el['p-sub'].hidden=!el['p-sub'].textContent;
  var timed=!!s.dur;
  el['p-clock'].hidden=!timed;el['p-bar'].hidden=!timed;
  el['p-next'].textContent=(s.type==='work'||(s.type==='emom'&&!emRest))?(s.nextText||''):'';
  el['p-next'].hidden=!el['p-next'].textContent;
  /* tasks (endurance rounds) */
  if(s.type==='emom'&&!emRest){
    el['p-tasks'].hidden=false;
    el['p-tasks'].innerHTML=s.tasks.map(function(t,n){
      return '<button type="button" class="task" data-task="'+n+'" aria-pressed="'+(P.ticks[n]?'true':'false')+'"><span class="ck"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="t">'+esc(t)+'</span></button>';
    }).join('');
  }else{el['p-tasks'].hidden=true;el['p-tasks'].innerHTML=''}
  /* details */
  var det=s.details||[];
  el['p-more'].hidden=!det.length;
  el['p-details'].innerHTML=det.map(function(d){return '<h3>'+esc(d.name)+'</h3><p>'+esc(d.desc)+'</p>'}).join('');
  setDetails(P.detailsOpen&&det.length>0);
  /* controls */
  var mb=el['p-main-btn'];
  if(s.type==='reps'){mb.textContent='Done';mb.dataset.mode='done'}
  else{mb.innerHTML=P.paused?ICON_PLAY:ICON_PAUSE;mb.dataset.mode='pause'}
}
function setDetails(open){
  P.detailsOpen=open;
  el['p-details'].hidden=!open;
  el['p-more'].setAttribute('aria-expanded',open?'true':'false');
  el['p-more'].textContent=open?'Hide details':'How to do it';
}
function tick(){
  if(!P.active||P.paused)return;
  var now=Date.now();
  P.activeMs+=now-P.lastTick;P.lastTick=now;
  var s=cur(),moved=false;
  while(s&&s.dur&&now>=P.endsAt){
    var carry=P.endsAt;
    if(P.i>=P.steps.length-1){finish();return}
    enterStep(P.i+1,carry);s=cur();moved=true;
  }
  if(moved)cueStart(s);
  updateClock(now);
}
function updateClock(now){
  var s=cur();if(!s)return;
  var ref=P.paused?P.pausedAt:now,frac=0;
  if(s.dur){
    var rem=Math.max(0,P.endsAt-ref),sec=Math.ceil(rem/1000);
    frac=clamp(1-rem/(s.dur*1000),0,1);
    var txt=fmt(sec);
    if(el['p-clock'].textContent!==txt)el['p-clock'].textContent=txt;
    el['p-barfill'].style.transform='scaleX('+frac+')';
    if(!P.paused){
      if(sec>=1&&sec<=3&&P.lastBeep!==sec&&s.dur>3){P.lastBeep=sec;sound('count')}
      if(s.half&&!P.halfDone&&rem<=s.dur*500){P.halfDone=true;sound('half');buzz([60,60,60]);flashCue(s.half)}
    }
  }
  var w=(s.dur||s.est||0),done=P.run.cum[P.i]+w*frac;
  for(var k=0;k<P.run.segs.length;k++){
    var sg=P.run.segs[k],f=sg.total?clamp((done-sg.start)/sg.total,0,1):0;
    P.segEls[k].style.transform='scaleX('+f+')';
  }
}
function flashCue(t){
  el['p-cue'].textContent=t;el['p-cue'].hidden=false;
  clearTimeout(P.cueTimer);P.cueTimer=setTimeout(hideCue,4000);
}
function hideCue(){clearTimeout(P.cueTimer);el['p-cue'].hidden=true}
function togglePause(){
  var s=cur();if(!P.active||s.type==='reps')return;
  var now=Date.now();
  if(P.paused){
    var shift=now-P.pausedAt;
    P.endsAt+=shift;P.stepStart+=shift;P.lastTick=now;P.paused=false;wakeOn();
  }else{
    P.paused=true;P.pausedAt=now;
  }
  renderStep();updateClock(now);
}
function nextStep(){
  if(!P.active)return;
  if(P.i>=P.steps.length-1)finish();else goto(P.i+1);
}
function prevStep(){
  if(!P.active)return;
  var s=cur(),ref=P.paused?P.pausedAt:Date.now();
  if(s.dur&&ref-P.stepStart>3000)goto(P.i);
  else if(P.i>0)goto(P.i-1);
  else goto(0);
}
function stopPlayer(){
  clearInterval(P.timer);P.timer=null;P.active=false;wakeOff();hideCue();
  try{if('speechSynthesis' in window)window.speechSynthesis.cancel()}catch(e){}
  el.player.hidden=true;document.body.style.overflow='';
}
function finish(){
  clearInterval(P.timer);P.timer=null;P.active=false;wakeOff();hideCue();
  var secs=Math.round(P.activeMs/1000);
  if(P.kind==='workout'){H.push({t:Date.now(),s:secs});H=H.slice(-200);save('kb.history',H);renderHistory()}
  el['p-fseg'].innerHTML=P.run.segs.map(function(sg){return '<span data-phase="'+sg.phase+'" style="flex:'+Math.max(sg.total,1)+'"><i style="background:var(--pbg);transform:scaleX(1)"></i></span>'}).join('');
  el['f-title'].textContent=P.kind==='workout'?'Session complete':'Timer finished';
  el['f-time'].textContent='Total time '+fmtLong(secs);
  el['f-week'].textContent=P.kind==='workout'?plural(weekCount(),'session')+' this week':'';
  el['p-finish'].hidden=false;
  sound('done');buzz([200,100,200,100,300]);say('Done. Nice work.');
  try{el['f-close'].focus()}catch(e){}
}

function tVal(k){var v=C[k];if(k==='rounds')return ''+v;if(v===0)return 'Off';return v>=60?fmtLong(v):v+' sec'}

   '<div class="set-block"><h2>Use without internet</h2>'+
   '<p>'+(isFile?'You\u2019re using an offline copy. Everything runs on your device and nothing is sent anywhere.':'Everything runs on your device. After your first visit the app is stored on your phone, so it opens with no signal. Use your browser\u2019s Add to Home Screen option to install it.')+'</p>'+
   (DL&&!isFile?'<button type="button" class="btn2" id="s-save">Save offline copy</button>':'')+
   '<div class="status" id="s-status" role="status">'+esc(dlStatus)+'</div></div>'+
   '<div class="set-block"><h2>History</h2><p id="s-hist"></p><button type="button" class="btn2" id="s-clear">Clear history</button></div>';
  var h=$('s-hist');if(h)h.textContent=H.length?plural(H.length,'session')+' completed, '+weekCount()+' this week.':'No sessions yet.';
}
function offlineHTML(){
  try{
    var d=new DOMParser().parseFromString(SNAPSHOT,'text/html');
    [].forEach.call(d.querySelectorAll('script[src],base,meta[http-equiv]'),function(n){n.remove()});
    return '<!DOCTYPE html>\n'+d.documentElement.outerHTML;
  }catch(e){return '<!DOCTYPE html>\n'+SNAPSHOT}
}

/* ================= events ================= */
function showTab(name){
  Object.keys(vw).forEach(function(k){vw[k].hidden=(k!==name)});
  [].forEach.call($('nav').querySelectorAll('button'),function(b){
    if(b.dataset.tab===name)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  window.scrollTo(0,0);
}
$('nav').addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(b)showTab(b.dataset.tab)});

vw.workout.addEventListener('click',function(e){
  var t=e.target.closest('[data-toggle]');
  if(t){
    var body=$('b-'+t.dataset.toggle),open=t.getAttribute('aria-expanded')==='true';
    t.setAttribute('aria-expanded',open?'false':'true');body.hidden=open;return;
  }
  var f=e.target.closest('[data-from]');
  if(f){startPlayer(buildWorkout(+f.dataset.from),'workout');return}
  if(e.target.closest('#start'))startPlayer(buildWorkout(0),'workout');
});

vw.timer.addEventListener('click',function(e){
  var b=e.target.closest('[data-k]');
  if(b){
    var k=b.dataset.k,r=RANGE[k],v=C[k]+(+b.dataset.d)*r[2];
    C[k]=clamp(v,r[0],r[1]);save('kb.timer',C);updateTimerView();return;
  }
  var p=e.target.closest('[data-preset]');
  if(p){var pr=PRESETS[+p.dataset.preset];C.work=pr.work;C.rest=pr.rest;C.rounds=pr.rounds;save('kb.timer',C);updateTimerView();return}
  if(e.target.closest('#t-start'))startPlayer(buildHiit(),'hiit');
});

vw.settings.addEventListener('click',function(e){
  var r=e.target.closest('[data-set]');
  if(r){var k=r.dataset.set;S[k]=!S[k];save('kb.settings',S);r.setAttribute('aria-checked',S[k]?'true':'false');if(k==='sound'||k==='voice')ensureAudio();return}
  if(e.target.closest('#s-test')){ensureAudio();sound('go');setTimeout(function(){sound('rest')},400);buzz(120);say('Sound check');return}
  if(e.target.closest('#s-save')){
    if(!DL)return;
    DL.save({filename:'kettlebell-and-mat.html',data:offlineHTML()}).then(function(){dlStatus='Saved. Open the file in your browser to use it offline.';var s=$('s-status');if(s)s.textContent=dlStatus}).catch(function(err){dlStatus=(err&&err.code==='declined')?'Not saved.':'Saving isn\u2019t available here.';var s=$('s-status');if(s)s.textContent=dlStatus});
    return;
  }
  var c=e.target.closest('#s-clear');
  if(c){
    if(c.dataset.armed==='1'){H=[];save('kb.history',H);renderSettings();renderHistory()}
    else{c.dataset.armed='1';c.textContent='Tap again to clear'}
  }
});

el['p-main-btn'].addEventListener('click',function(){var s=cur();if(!s)return;if(s.type==='reps')nextStep();else togglePause()});
el['p-fwd'].addEventListener('click',nextStep);
el['p-back'].addEventListener('click',prevStep);
el['p-more'].addEventListener('click',function(){setDetails(!P.detailsOpen)});
el['p-tasks'].addEventListener('click',function(e){
  var b=e.target.closest('[data-task]');if(!b||!P.active)return;
  var n=+b.dataset.task,s=cur();
  P.ticks[n]=!P.ticks[n];
  var all=s.tasks.every(function(_,i){return !!P.ticks[i]});
  var was=P.emomRest;P.emomRest=all;
  renderStep();
  if(all&&!was){sound('rest');buzz([80,60,80]);say('Rest')}
  updateClock(Date.now());
});
el['p-close'].addEventListener('click',function(){el['p-confirm'].hidden=false;try{el['c-keep'].focus()}catch(e){}});
el['c-keep'].addEventListener('click',function(){el['p-confirm'].hidden=true;try{el['p-main-btn'].focus()}catch(e){}});
el['c-end'].addEventListener('click',function(){el['p-confirm'].hidden=true;stopPlayer()});
el['f-close'].addEventListener('click',function(){stopPlayer();renderSettings()});
el['p-sound'].addEventListener('click',function(){
  S.sound=!S.sound;save('kb.settings',S);syncSoundBtn();
  var st=vw.settings.querySelector('[data-set="sound"]');if(st)st.setAttribute('aria-checked',S.sound?'true':'false');
});
function syncSoundBtn(){
  el['p-sound'].setAttribute('aria-pressed',S.sound?'true':'false');
  el['p-sound'].setAttribute('aria-label',S.sound?'Sound on':'Sound off');
  el['p-wave'].style.display=S.sound?'':'none';
}
document.addEventListener('keydown',function(e){
  if(!P.active||el.player.hidden)return;
  if(e.key===' '||e.key==='Spacebar'){e.preventDefault();var s=cur();if(s.type==='reps')nextStep();else togglePause()}
  else if(e.key==='ArrowRight')nextStep();
  else if(e.key==='ArrowLeft')prevStep();
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&P.active){wakeOn();tick()}
});

/* ================= boot ================= */
renderWorkout();renderTimer();renderSettings();syncSoundBtn();
try{
  if(window.claude&&typeof window.claude.use==='function'){
    window.claude.use('downloads').then(function(d){if(d){DL=d;renderSettings()}}).catch(function(){});
  }
}catch(e){}
})();
</script>
<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
</body>
</html>
