name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one half-done: a cancelled run could
# leave migrations applied with the old Worker still serving.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Worker serves this directory as its static assets, so the app has
      # to be built before wrangler packages it.
      - name: Build the web app
        run: pnpm --filter @kb/web build

      # Before the deploy, so the new code never meets an old schema.
      - name: Apply database migrations
        run: pnpm --filter @kb/api exec wrangler d1 migrations apply kb-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: pnpm --filter @kb/api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # A deploy that reports success while serving a broken app is worse than
      # one that fails, so check the real thing before calling it done.
      - name: Smoke test the deployment
        run: |
          set -euo pipefail
          BASE="${{ vars.APP_URL }}"
          if [ -z "$BASE" ]; then
            echo "Set the APP_URL repository variable to the deployed origin." >&2
            exit 1
          fi

          echo "Checking $BASE"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$BASE/api/health" | tee /dev/stderr | grep -q '"ok":true'
          curl -fsS "$BASE/" | grep -qi '<div id="root">'
          # A signed-out request must be refused, not quietly served.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/me")" = "401"
          echo "Deployment is up."
